<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Jump Game</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(to top, #87CEEB 0%, #E0F6FF 50%, #87CEEB 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  #game {
    width: 800px;
    height: 300px;
    border: 3px solid #333;
    background: #f0f0f0;
    position: relative;
    overflow: hidden;
  }
  .ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 40px;
    background: repeating-linear-gradient(90deg, #555 0px, #555 20px, #777 20px, #777 40px);
  }
  #car {
    width: 60px;
    height: 30px;
    background: red;
    border-radius: 8px 8px 3px 3px;
    position: absolute;
    bottom: 40px;
    left: 80px;
  }
  #car::before {
    content: '';
    position: absolute;
    width: 15px;
    height: 15px;
    background: #333;
    border-radius: 50%;
    bottom: -8px;
    left: 5px;
  }
  #car::after {
    content: '';
    position: absolute;
    width: 15px;
    height: 15px;
    background: #333;
    border-radius: 50%;
    bottom: -8px;
    right: 5px;
  }
  .stone {
    width: 25px;
    height: 25px;
    background: #444;
    border-radius: 3px;
    position: absolute;
    bottom: 40px;
  }
  #score {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 24px;
    font-weight: bold;
    color: #333;
  }
  #gameOver {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px;
    font-weight: bold;
    color: #d00;
    display: none;
    text-align: center;
  }
  #start {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 18px;
    color: #333;
    text-align: center;
  }
</style>
</head>
<body>
<div id="game">
  <div class="ground"></div>
  <div id="car"></div>
  <div id="score">Score: 0</div>
  <div id="start">UP Arrow එක ඔබන්න<br>Game පටන් ගන්න</div>
  <div id="gameOver">GAME OVER<br><span style="font-size:18px">Space ඔබන්න නැවත පටන් ගන්න</span></div>
</div>

<script>
let car = document.getElementById('car');
let game = document.getElementById('game');
let scoreEl = document.getElementById('score');
let gameOverEl = document.getElementById('gameOver');
let startEl = document.getElementById('start');

let isJumping = false;
let isGameOver = true;
let isGameStarted = false;
let score = 0;
let stones = [];
let gameSpeed = 6;

function jump() {
  if (isJumping || isGameOver) return;
  isJumping = true;
  let jumpHeight = 0;
  let up = true;
  
  let jumpInterval = setInterval(() => {
    if (up) {
      jumpHeight += 7;
      car.style.bottom = 40 + jumpHeight + 'px';
      if (jumpHeight >= 100) up = false;
    } else {
      jumpHeight -= 7;
      car.style.bottom = 40 + jumpHeight + 'px';
      if (jumpHeight <= 0) {
        car.style.bottom = '40px';
        clearInterval(jumpInterval);
        isJumping = false;
      }
    }
  }, 20);
}

function createStone() {
  if (isGameOver) return;
  let stone = document.createElement('div');
  stone.classList.add('stone');
  stone.style.left = '800px';
  game.appendChild(stone);
  stones.push(stone);
}

function moveStones() {
  stones.forEach((stone, index) => {
    let stoneLeft = parseInt(stone.style.left);
    stone.style.left = stoneLeft - gameSpeed + 'px';
    
    // Collision check
    let carRect = car.getBoundingClientRect();
    let stoneRect = stone.getBoundingClientRect();
    
    if (
      carRect.left < stoneRect.right &&
      carRect.right > stoneRect.left &&
      carRect.bottom > stoneRect.top &&
      carRect.top < stoneRect.bottom
    ) {
      gameOver();
    }
    
    if (stoneLeft < -30) {
      stone.remove();
      stones.splice(index, 1);
      score++;
      scoreEl.innerText = 'Score: ' + score;
      if (score % 10 === 0) gameSpeed += 0.5; // speed වැඩි වෙනවා
    }
  });
}

function gameLoop() {
  if (!isGameOver) {
    moveStones();
  }
  requestAnimationFrame(gameLoop);
}

function gameOver() {
  isGameOver = true;
  gameOverEl.style.display = 'block';
  stones.forEach(s => s.remove());
  stones = [];
}

function startGame() {
  isGameOver = false;
  isGameStarted = true;
  score = 0;
  gameSpeed = 6;
  scoreEl.innerText = 'Score: 0';
  gameOverEl.style.display = 'none';
  startEl.style.display = 'none';
  
  // harithara stone spawn
  setInterval(() => {
    if (!isGameOver) createStone();
  }, 1500);
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowUp') {
    if (!isGameStarted) startGame();
    jump();
  }
  if (e.code === 'Space' && isGameOver) {
    startGame();
  }
});

gameLoop();
</script>
</body>
</html>
