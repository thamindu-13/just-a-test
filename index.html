<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WOXIA - 3D Racing</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; touch-action: none; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }

  /* Loading Screen */
  #loading {
    position: fixed; width: 100%; height: 100%; background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
  }
  #loading h1 {
    font-size: 60px; color: #fff; text-shadow: 0 0 20px #00f0ff; margin-bottom: 30px;
    animation: glow 2s ease-in-out infinite;
  }
  @keyframes glow { 0%,100%{text-shadow:0 0 20px #00f0ff} 50%{text-shadow:0 0 40px #00f0ff} }
  #loadingBar { width: 300px; height: 8px; background: #333; border-radius: 10px; overflow: hidden; }
  #loadingFill { height: 100%; width: 0%; background: linear-gradient(90deg, #00f0ff, #ff00ff); transition: width 0.3s; }

  /* Vehicle Select */
  #vehicleSelect {
    position: fixed; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
    display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 900;
  }
  #vehicleSelect h2 { color: #fff; font-size: 32px; margin-bottom: 20px; }
  #vehicleBox { width: 90%; max-width: 400px; height: 250px; background: #111; border: 2px solid #00f0ff; border-radius: 15px; display: flex; justify-content: center; align-items: center; position: relative; }
 .navBtn { position: absolute; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; background: #00f0ff; border: none; border-radius: 50%; font-size: 24px; color: #000; }
  #leftBtn { left: -25px; } #rightBtn { right: -25px; }
  #vehicleInfo { color: #fff; text-align: center; margin: 20px; }
  #goBtn { padding: 15px 50px; background: linear-gradient(90deg, #ff00ff, #00f0ff); border: none; border-radius: 30px; font-size: 20px; font-weight: bold; color: #fff; }

  /* Game UI */
  #gameUI { position: fixed; top: 0; width: 100%; display: none; z-index: 800; }
  #topBar { display: flex; justify-content: space-between; padding: 15px; color: #fff; font-size: 18px; font-weight: bold; }
  #controls { position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; }
 .ctrlBtn { width: 70px; height: 70px; background: rgba(0,240,255,0.3); border: 2px solid #00f0ff; border-radius: 50%; color: #fff; font-size: 24px; }
  #brake { background: rgba(255,0,0,0.3); border-color: red; }
</style>
</head>
<body>

<div id="loading">
  <h1>WOXIA</h1>
  <div id="loadingBar"><div id="loadingFill"></div></div>
</div>

<div id="vehicleSelect">
  <h2>CHOOSE YOUR RIDE</h2>
  <div id="vehicleBox">
    <button class="navBtn" id="leftBtn">←</button>
    <div id="vehiclePreview"></div>
    <button class="navBtn" id="rightBtn">→</button>
  </div>
  <div id="vehicleInfo">
    <h3 id="vName">Ferrari</h3>
    <p id="vSpeed">Speed: 320 km/h</p>
    <p id="vAccel">Acceleration: 9/10</p>
  </div>
  <button id="goBtn">GO!</button>
</div>

<div id="gameUI">
  <div id="topBar">
    <div>Time: <span id="timer">60</span>s</div>
    <div>Speed: <span id="speed">0</span> km/h</div>
    <div>Score: <span id="score">0</span></div>
  </div>
  <div id="controls">
    <button class="ctrlBtn" id="left">←</button>
    <button class="ctrlBtn" id="brake">B</button>
    <button class="ctrlBtn" id="right">→</button>
    <button class="ctrlBtn" id="accel">↑</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene, camera, renderer, car, road, clock;
let speed = 0, maxSpeed = 320, accelerating = false, braking = false;
let lane = 0, targetX = 0; // -1 left, 0 center, 1 right
let timeLeft = 60, score = 0, gameRunning = false;
let vehicles = [
  {name: "Ferrari", speed: 320, accel: 9, color: 0xff0000},
  {name: "Mitsubishi", speed: 250, accel: 7, color: 0x00ff00},
  {name: "KDH Van", speed: 140, accel: 4, color: 0xffffff},
  {name: "Metro Bus", speed: 100, accel: 3, color: 0xffff00}
];
let currentVehicle = 0;

// Loading
let load = 0;
let loadInterval = setInterval(()=>{
  load += 5;
  document.getElementById('loadingFill').style.width = load + '%';
  if(load >= 100){
    clearInterval(loadInterval);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('vehicleSelect').style.display = 'flex';
    updateVehiclePreview();
  }
}, 100);

// Vehicle Selection
function updateVehiclePreview(){
  let v = vehicles[currentVehicle];
  document.getElementById('vName').innerText = v.name;
  document.getElementById('vSpeed').innerText = 'Speed: ' + v.speed + ' km/h';
  document.getElementById('vAccel').innerText = 'Acceleration: ' + v.accel + '/10';
  document.getElementById('vehiclePreview').innerHTML = `<div style="width:150px;height:70px;background:#${v.color.toString(16)};border-radius:10px;box-shadow:0 0 20px #${v.color.toString(16)}"></div>`;
}
document.getElementById('leftBtn').onclick = ()=>{ currentVehicle = (currentVehicle + 3) % 4; updateVehiclePreview(); }
document.getElementById('rightBtn').onclick = ()=>{ currentVehicle = (currentVehicle + 1) % 4; updateVehiclePreview(); }

document.getElementById('goBtn').onclick = ()=>{
  document.getElementById('vehicleSelect').style.display = 'none';
  document.getElementById('gameUI').style.display = 'block';
  initGame();
  startGame();
}

function initGame(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  let dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5,10,7);
  scene.add(dirLight);

  // Road
  let roadGeo = new THREE.PlaneGeometry(12, 500);
  let roadMat = new THREE.MeshLambertMaterial({color: 0x333});
  road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI/2;
  scene.add(road);

  // Road lines
  for(let i=0; i<20; i++){
    let line = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.01, 5), new THREE.MeshBasicMaterial({color:0xffff00}));
    line.position.set(0, 0.01, -i*25);
    scene.add(line);
  }

  // Player Car
  let carGeo = new THREE.BoxGeometry(1, 0.5, 2);
  let carMat = new THREE.MeshLambertMaterial({color: vehicles[currentVehicle].color});
  car = new THREE.Mesh(carGeo, carMat);
  car.position.y = 0.5;
  scene.add(car);

  camera.position.set(0, 5, 10);
  camera.lookAt(0,0,0);
  clock = new THREE.Clock();
  animate();
}

function startGame(){
  gameRunning = true;
  maxSpeed = vehicles[currentVehicle].speed;
  let gameTimer = setInterval(()=>{
    if(!gameRunning) clearInterval(gameTimer);
    timeLeft--;
    document.getElementById('timer').innerText = timeLeft;
    if(timeLeft <= 0){
      gameRunning = false;
      alert('Time Up! Score: ' + score);
    }
  }, 1000);
}

// Controls
function move(dir){
  if(!gameRunning) return;
  lane += dir;
  if(lane < -1) lane = -1;
  if(lane > 1) lane = 1;
  targetX = lane * 3;
}
document.getElementById('left').ontouchstart = ()=>move(-1);
document.getElementById('right').ontouchstart = ()=>move(1);
document.getElementById('accel').ontouchstart = ()=>accelerating=true;
document.getElementById('accel').ontouchend = ()=>accelerating=false;
document.getElementById('brake').ontouchstart = ()=>braking=true;
document.getElementById('brake').ontouchend = ()=>braking=false;

// Game Loop
function animate(){
  requestAnimationFrame(animate);
  if(!gameRunning) return;

  // Car movement
  if(accelerating) speed += vehicles[currentVehicle].accel * 0.5;
  if(braking) speed -= 5;
  if(!accelerating) speed -= 0.5;
  speed = Math.max(0, Math.min(speed, maxSpeed));

  car.position.x += (targetX - car.position.x) * 0.1;
  road.position.z += speed * 0.05;
  if(road.position.z > 50) road.position.z = 0;

  score += Math.floor(speed/10);
  document.getElementById('speed').innerText = Math.floor(speed);
  document.getElementById('score').innerText = score;

  renderer.render(scene, camera);
}

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
