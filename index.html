<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WOXIA GTA</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; touch-action: none; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }

  #loading { position: fixed; width: 100%; height: 100%; background: linear-gradient(#87CEEB, #FFD700); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
  #loading h1 { font-size: 60px; color: #fff; text-shadow: 0 0 30px #000; margin-bottom: 30px; }
  #loadingBar { width: 80%; max-width: 300px; height: 10px; background: rgba(0,0,0,0.3); border-radius: 10px; overflow: hidden; }
  #loadingFill { height: 100%; width: 0%; background: linear-gradient(90deg, #FFD700, #FF4500); transition: width 0.3s; }

  #vehicleSelect { position: fixed; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 900; }
  #vehicleSelect h2 { color: #FFD700; font-size: 32px; margin-bottom: 20px; }
  #vehicleBox { width: 90%; max-width: 400px; height: 220px; background: #111; border: 3px solid #FFD700; border-radius: 15px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  #vehicleBox img { width: 100%; height: 100%; object-fit: cover; }
.navBtn { position: absolute; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; background: #FFD700; border: none; border-radius: 50%; font-size: 24px; color: #000; font-weight: bold; }
  #leftBtn { left: 10px; } #rightBtn { right: 10px; }
  #vehicleInfo { color: #fff; text-align: center; margin: 20px; font-size: 18px; }
  #goBtn { padding: 15px 50px; background: linear-gradient(90deg, #FF4500, #FFD700); border: none; border-radius: 30px; font-size: 20px; font-weight: bold; color: #000; }

  #gameUI { position: fixed; top: 0; width: 100%; display: none; z-index: 800; }
  #topBar { display: flex; justify-content: space-between; padding: 15px; color: #fff; font-size: 18px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
  #nitroBar { width: 150px; height: 10px; background: rgba(0,0,0,0.5); border-radius: 5px; margin-top: 5px; }
  #nitroFill { height: 100%; width: 100%; background: cyan; border-radius: 5px; }
  #controls { position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; }
.ctrlBtn { width: 65px; height: 65px; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 20px; backdrop-filter: blur(5px); }
  #nitro { border-color: cyan; color: cyan; }
  #gameOver { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; color: red; font-weight: bold; display: none; text-shadow: 0 0 10px #000; }
</style>
</head>
<body>

<div id="loading"><h1>WOXIA</h1><div id="loadingBar"><div id="loadingFill"></div></div></div>

<div id="vehicleSelect">
  <h2>CHOOSE YOUR RIDE</h2>
  <div id="vehicleBox">
    <img id="vehicleImg" src="">
    <button class="navBtn" id="leftBtn">←</button>
    <button class="navBtn" id="rightBtn">→</button>
  </div>
  <div id="vehicleInfo">
    <h3 id="vName">Ferrari</h3>
    <p id="vSpeed">Speed: 320 km/h</p>
  </div>
  <button id="goBtn">GO!</button>
</div>

<div id="gameUI">
  <div id="topBar">
    <div>Time: <span id="timer">60</span>s</div>
    <div>Speed: <span id="speed">0</span> km/h
      <div id="nitroBar"><div id="nitroFill"></div></div>
    </div>
    <div>Score: <span id="score">0</span></div>
  </div>
  <div id="controls">
    <button class="ctrlBtn" id="left">←</button>
    <button class="ctrlBtn" id="brake">B</button>
    <button class="ctrlBtn" id="nitro">NITRO</button>
    <button class="ctrlBtn" id="right">→</button>
    <button class="ctrlBtn" id="accel">↑</button>
  </div>
</div>
<div id="gameOver">CRASH!<br><span style="font-size:20px">Tap to Restart</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene, camera, renderer, car, road;
let speed = 0, maxSpeed = 320, accelerating = false, braking = false, nitro = false, nitroLevel = 100;
let lane = 0, targetX = 0;
let timeLeft = 60, score = 0, gameRunning = false;
let trees = [], rocks = [];

let vehicles = [
  {name: "Ferrari 488", speed: 320, accel: 9, img: "https://images.unsplash.com/photo-1583121274602-3e2820c69888?w=400", color: 0xff0000},
  {name: "Mitsubishi Lancer", speed: 250, accel: 7, img: "https://images.unsplash.com/photo-1618843479313-5f18e7a6f5ce?w=400", color: 0x0066ff},
  {name: "KDH Van", speed: 140, accel: 4, img: "https://images.unsplash.com/photo-1629811998622-9b8b9b3b3b3b?w=400", color: 0xffffff},
  {name: "Metro Bus", speed: 100, accel: 3, img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=400", color: 0xffff00}
];
let currentVehicle = 0;

// Loading
let load = 0;
let loadInterval = setInterval(()=>{
  load += 3;
  document.getElementById('loadingFill').style.width = load + '%';
  if(load >= 100){
    clearInterval(loadInterval);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('vehicleSelect').style.display = 'flex';
    updateVehiclePreview();
  }
}, 100);

function updateVehiclePreview(){
  let v = vehicles[currentVehicle];
  document.getElementById('vehicleImg').src = v.img;
  document.getElementById('vName').innerText = v.name;
  document.getElementById('vSpeed').innerText = 'Speed: ' + v.speed + ' km/h';
}
document.getElementById('leftBtn').onclick = ()=>{ currentVehicle = (currentVehicle + 3) % 4; updateVehiclePreview(); }
document.getElementById('rightBtn').onclick = ()=>{ currentVehicle = (currentVehicle + 1) % 4; updateVehiclePreview(); }

document.getElementById('goBtn').onclick = ()=>{
  document.getElementById('vehicleSelect').style.display = 'none';
  document.getElementById('gameUI').style.display = 'block';
  initGame();
  startGame();
}

function initGame(){
  scene = new THREE.Scene();

  // Beautiful Sky + Sun
  scene.background = new THREE.Color(0x87CEEB);
  let sun = new THREE.Mesh(new THREE.SphereGeometry(5), new THREE.MeshBasicMaterial({color:0xFFD700}));
  sun.position.set(50, 80, -200);
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  let dirLight = new THREE.DirectionalLight(0xFFD700, 0.5);
  dirLight.position.set(50,80,-200);
  scene.add(dirLight);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Road
  let roadGeo = new THREE.PlaneGeometry(12, 2000);
  let roadMat = new THREE.MeshLambertMaterial({color: 0x2a2a2a});
  road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI/2;
  scene.add(road);

  // Forest Trees
  for(let i=0; i<120; i++){
    let tree = new THREE.Group();
    let trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 3), new THREE.MeshLambertMaterial({color:0x8B4513}));
    let leaves = new THREE.Mesh(new THREE.ConeGeometry(2, 5), new THREE.MeshLambertMaterial({color:0x006400}));
    leaves.position.y = 3;
    tree.add(trunk); tree.add(leaves);
    tree.position.set((Math.random() > 0.5? 8 : -8) + Math.random()*4, 1.5, -i*12 + Math.random()*20);
    trees.push(tree);
    scene.add(tree);
  }

  // Player Car
  let v = vehicles[currentVehicle];
  let carGeo = new THREE.BoxGeometry(1.8, 0.8, 4);
  let carMat = new THREE.MeshLambertMaterial({color: v.color});
  car = new THREE.Mesh(carGeo, carMat);
  car.position.y = 0.8;
  scene.add(car);

  // Spawn Rocks
  setInterval(()=>{ if(gameRunning) spawnRock(); }, 2000);

  camera.position.set(0, 6, 12);
  camera.lookAt(0,0,-10);
  animate();
}

function spawnRock(){
  let rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.8), new THREE.MeshLambertMaterial({color:0x555}));
  rock.position.set((Math.floor(Math.random()*3)-1)*3.5, 0.8, -150);
  rock.userData = {lane: (Math.floor(Math.random()*3)-1)};
  rocks.push(rock);
  scene.add(rock);
}

function startGame(){
  gameRunning = true;
  maxSpeed = vehicles[currentVehicle].speed;
  let gameTimer = setInterval(()=>{
    if(!gameRunning) clearInterval(gameTimer);
    timeLeft--;
    document.getElementById('timer').innerText = timeLeft;
    if(timeLeft <= 0) endGame();
  }, 1000);

  // Nitro refill
  setInterval(()=>{
    if(!nitro && nitroLevel < 100) nitroLevel += 2;
    document.getElementById('nitroFill').style.width = nitroLevel + '%';
  }, 100);
}

function endGame(){
  gameRunning = false;
  document.getElementById('gameOver').style.display = 'block';
}

// Controls
function move(dir){
  if(!gameRunning) return;
  lane += dir;
  if(lane < -1) lane = -1;
  if(lane > 1) lane = 1;
  targetX = lane * 3.5;
}
document.getElementById('left').ontouchstart = ()=>move(-1);
document.getElementById('right').ontouchstart = ()=>move(1);
document.getElementById('accel').ontouchstart = ()=>accelerating=true;
document.getElementById('accel').ontouchend = ()=>accelerating=false;
document.getElementById('brake').ontouchstart = ()=>braking=true;
document.getElementById('brake').ontouchend = ()=>braking=false;
document.getElementById('nitro').ontouchstart = ()=>{ if(nitroLevel > 10){ nitro=true; nitroLevel-=10; } };
document.getElementById('nitro').ontouchend = ()=>nitro=false;
document.getElementById('gameOver').onclick = ()=>location.reload();

// Game Loop
function animate(){
  requestAnimationFrame(animate);
  if(!gameRunning) return;

  let currentMax = nitro? maxSpeed * 1.8 : maxSpeed;
  if(accelerating) speed += vehicles[currentVehicle].accel * (nitro?1.5:0.5);
  if(braking) speed -= 5;
  if(!accelerating) speed -= 0.8;
  speed = Math.max(0, Math.min(speed, currentMax));

  car.position.x += (targetX - car.position.x) * 0.15;

  // Move Trees
  trees.forEach(tree=>{
    tree.position.z += speed * 0.08;
    if(tree.position.z > 10) tree.position.z = -400 + Math.random()*20;
  });

  // Move Rocks + Collision
  rocks.forEach((rock, i)=>{
    rock.position.z += speed * 0.08;
    if(rock.position.z > 10){
      scene.remove(rock);
      rocks.splice(i,1);
      score += 10;
    }
    // Collision check
    if(Math.abs(rock.position.z - car.position.z) < 2 && Math.abs(rock.position.x - car.position.x) < 1.5){
      endGame();
    }
  });

  road.position.z += speed * 0.05;
  score += Math.floor(speed/10);
  document.getElementById('speed').innerText = Math.floor(speed);
  document.getElementById('score').innerText = score;

  renderer.render(scene, camera);
}
</script>
</body>
</html>
